# -Djava.net.preferIPv4Stack=true：强制 Gradle daemon 走 IPv4。
# 双栈环境下 localhost 可能优先解析为 ::1，而 daemon 监听在 127.0.0.1，
# 表现为「Timeout waiting to connect to the Gradle daemon」；该参数用于规避此问题。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
